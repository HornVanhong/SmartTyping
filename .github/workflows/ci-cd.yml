name: TypeMaster CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # Required for AWS OIDC authentication (Zero-secret authentication)
  contents: read

jobs:
  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm run test

      - name: Next.js production build verification
        env:
          NEXT_PUBLIC_API_URL: https://api.typemaster.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://api.typemaster.com/ws
        run: npm run build

  test-backend:
    name: Test Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven tests
        run: mvn clean test -f apps/api/pom.xml

  build-and-deploy-aws:
    name: Deploy Backend to AWS (App Runner / ECR)
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Supports both AWS OIDC Role (AWS_ROLE_ARN) and Access Keys (AWS_ACCESS_KEY_ID)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
          role-session-name: GitHubActionsSmartTyping-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names typemaster-api || \
          aws ecr create-repository --repository-name typemaster-api --image-scanning-configuration scanOnPush=true

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: typemaster-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f apps/api/Dockerfile apps/api
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Trigger AWS App Runner Deployment (if service ARN configured)
        if: env.AWS_APP_RUNNER_ARN != ''
        env:
          AWS_APP_RUNNER_ARN: ${{ secrets.AWS_APP_RUNNER_ARN }}
        run: |
          echo "Triggering deployment for App Runner service: $AWS_APP_RUNNER_ARN"
          aws apprunner start-deployment --service-arn $AWS_APP_RUNNER_ARN
