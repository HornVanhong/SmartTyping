# ==============================================================================
# TypeMaster AWS EC2 / Nginx Reverse Proxy Configuration
# Provides SSL termination, WebSocket upgrade headers, and REST proxying
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream typemaster_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name api.typemaster.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.typemaster.com;

    # SSL Certificates (AWS ACM or Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/api.typemaster.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.typemaster.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy REST API requests
    location /api/ {
        proxy_pass http://typemaster_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Proxy Spring Boot Actuator health checks
    location /actuator/ {
        proxy_pass http://typemaster_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket STOMP connections
    location /ws {
        proxy_pass http://typemaster_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for idle multiplayer WebSocket sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
